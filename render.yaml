# Render Blueprint: Render dashboard > New > Blueprint > select this repository.
services:
  - type: web
    name: stock-market-prediction-api
    runtime: python
    plan: free
    rootDir: backend
    # CPU-only torch first; the default PyPI torch on Linux pulls ~2 GB of CUDA libraries.
    buildCommand: pip install "torch>=2.2,<2.7" --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      # Origin of the GitHub Pages frontend (scheme + host only, no path).
      - key: CORS_ORIGINS
        value: https://bharathkumar152003.github.io
      - key: TORCH_THREADS
        value: "1"
